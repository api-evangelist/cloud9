description: >-
  Entity graph for the Cloud9 public content API, derived mechanically from the JSON Schema each
  wp/v2 collection returns on HTTP OPTIONS. Four of the entities are Cloud9-specific custom post
  types registered on this site — players, teams, achievement and case-study — and they are the
  reason this surface is interesting: they make the roster and the competitive record queryable
  as data rather than as marketing pages. The remaining entities are WordPress core.
  IMPORTANT: every one of the four Cloud9 types carries an `acf` object (Advanced Custom Fields).
  Those field groups are where the actual esports semantics live (game, role, handle, event,
  placement, partner) and they are NOT described in the JSON Schema — the schema declares `acf`
  as an untyped object. They are therefore recorded here as an undescribed extension point, not
  guessed at.
