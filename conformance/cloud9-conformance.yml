method: probed
source: live probes of cloud9.gg + store.cloud9.gg
description: >-
  Cross-cutting standards conformance for the Cloud9 public surface, asserted only from what was
  observed live. Cloud9 makes no compliance or standards claims anywhere on its site, publishes
  no trust centre and no certifications, so no Compliance pointer is emitted. The standards it
  does satisfy it satisfies by virtue of the platforms it runs on — WordPress for the content API
  and the WordPress MCP adapter for the agent surface.
standards:
