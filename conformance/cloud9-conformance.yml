    https://cloud9.gg/.well-known/oauth-authorization-server
- id: oauth2.1-pkce
  conforms: true
  evidence: code_challenge_methods_supported [S256]; token_endpoint_auth_methods_supported [none]
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: 200 application/json at /.well-known/oauth-authorization-server
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: >-
    200 application/json at /.well-known/oauth-protected-resource; 401 responses carry a
    WWW-Authenticate Bearer challenge with a resource_metadata parameter
- id: rfc7591-dynamic-client-registration
  conforms: false
