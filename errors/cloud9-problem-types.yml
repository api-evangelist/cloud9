source: live error responses observed on https://cloud9.gg/wp-json/*
format: wordpress-rest-error
rfc9457: false
description: >-
  Cloud9 publishes no error reference. Every entry below is a response body actually returned by
  the live cloud9.gg API during this pass — no error was inferred from documentation or from the
  WordPress source. The envelope is the WordPress REST error object, not RFC 9457 problem+json:
  content-type is application/json, and the body carries `code` (a stable machine-readable slug),
  `message` (a human sentence) and `data.status` (the HTTP status repeated in the body).
  Validation failures additionally carry `data.params` and `data.details` keyed by parameter.
envelope:
  content_type: application/json
  fields:
    code: machine-readable error slug
    message: human-readable message
    data.status: HTTP status code
    data.params: map of parameter name to message (validation errors only)
    data.details: map of parameter name to {code, message} (validation errors only)
