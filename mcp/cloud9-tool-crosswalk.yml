  mcp:
    url: https://cloud9.gg/wp-json/mcp/mcp-oauth-server
    gated: true
    gate: OAuth 2.1 bearer (scope `mcp`); anonymous tools/list returns 401 mcp_unauthorized
    tools_enumerated: false
  graphql:
    present: false
