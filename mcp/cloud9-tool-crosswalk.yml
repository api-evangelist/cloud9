description: >-
  Crosswalk between Cloud9's agent-facing MCP surface and its machine-readable REST surface. Both
  live on the same host, cloud9.gg, and both are served by the same WordPress install — but they
  are inverted in posture. The REST surface (wp/v2, 118 routes) is anonymously readable with no
  credential of any kind: an agent can already list the roster, the teams, 564 achievements, the
  case studies and 89 news posts today. The MCP surface on the same content is fully gated behind
  OAuth 2.1, and its tool list cannot be enumerated without an authorized session. So the tool
  names are unknown while the underlying data is wide open. That is the finding worth recording:
  the gate is on the agent-native projection, not on the data.
surfaces:
