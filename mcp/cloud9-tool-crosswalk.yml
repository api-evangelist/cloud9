    present: false
    note: >-
      Cloud9 publishes no OpenAPI and no Swagger. The machine-readable contract used for this
      crosswalk is the live WordPress REST discovery index plus the per-collection JSON Schema
      returned by HTTP OPTIONS — both harvested verbatim into json-schema/.
  rest:
