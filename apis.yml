- aid: cloud9:store-json
  name: Cloud9 Store JSON Endpoints
  description: >-
    The official Cloud9 merchandise store at store.cloud9.gg is a Shopify storefront, and Shopify
    serves its standard anonymous product and collection JSON endpoints on it — /products.json
    returns the live catalogue with variants, prices, options and images, and /collections.json
    returns the storefront collections. These are platform endpoints Shopify exposes by default
    rather than a Cloud9-authored API, and Cloud9 documents neither, but both return 200 to an
    unauthenticated client and are the only machine-readable view of Cloud9 commerce.
  humanURL: https://store.cloud9.gg/
  baseURL: https://store.cloud9.gg
  tags:
