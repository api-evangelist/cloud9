apis:
- aid: cloud9:wordpress-rest-api
  name: Cloud9 WordPress REST API
  description: >-
    cloud9.gg runs on WordPress (WP Cloud / Automattic Atomic hosting) and serves the standard
    WordPress REST API anonymously at https://cloud9.gg/wp-json/. The discovery index enumerates
    277 routes across 14 namespaces; the wp/v2 namespace alone carries 118 routes. Read access
    requires no credentials and no key. Alongside the core content types (89 posts, 17 pages,
    1,175 media items, 19 categories, 3 users, a 769-item search index) the site registers four
    Cloud9-specific custom post types that make the roster and record queryable: players (47),
    teams (45), achievement (564) and case-study (7). Responses carry X-WP-Total and
    X-WP-TotalPages pagination headers and RFC 8288 Link headers, and every collection publishes
    a real JSON Schema over HTTP OPTIONS. Write operations are advertised on the same routes but
    require WordPress authentication (application passwords), so the public surface is read-only.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://cloud9.gg/wp-json/wp/v2
  tags:
  - Content
  - REST
  - JSON
  - WordPress
  - Esports
