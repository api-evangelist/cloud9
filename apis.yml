aid: cloud9
name: Cloud9
description: >-
  Cloud9 Esports, Inc. is a North American professional esports organization founded in 2013 by
  Jack and Paullie Etienne and headquartered in Santa Monica, California. It fields competitive
  rosters across League of Legends, VALORANT, VALORANT Game Changers, Call of Duty and Rainbow
  Six, and its trophy case includes the inaugural Overwatch World Championship, the 2018 Rocket
  League World Championship, multiple LCS titles and a Counter-Strike Major. Beyond competition
  it runs Club9 (a membership and fan community at club9.cloud9.gg), an official Shopify
  merchandise store at store.cloud9.gg, and a content and creator division. Cloud9 publishes no
  developer program and no OpenAPI, but its public web estate is machine-readable: cloud9.gg runs
  on WordPress and serves an anonymous, unauthenticated WordPress REST API at /wp-json/ covering
  news posts, pages, media and the Cloud9-specific players, teams, achievement and case-study
  content types, alongside a remote Model Context Protocol server advertised through RFC 8414 and
  RFC 9728 discovery metadata.
