description: >-
  Well-known discovery surface probed across the Cloud9 hosts. The notable find is on cloud9.gg,
  which publishes BOTH RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth
  protected-resource metadata pointing at a remote MCP server at
  https://cloud9.gg/wp-json/mcp/mcp-oauth-server. Both documents are served from the WordPress
  MCP adapter on the site, not from a bespoke Cloud9 identity provider. No security.txt (RFC
  9116), no api-catalog (RFC 9727), no OpenID Connect discovery document, no ai-plugin.json and
  no A2A agent card were found on any Cloud9 host. Note that cloud9.gg answers every unmatched
  /.well-known/* path with an HTTP 404 carrying the site's HTML 404 page, so the two 200s below
  are genuine JSON hits and not a single-page-app catch-all.
